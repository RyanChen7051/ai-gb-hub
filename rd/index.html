<style>
  html,body{margin:0;height:100%}
  body{background:#eef2f7;color:#1a1a1a;
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

<body>
<div class="box">
  <div class="sp" id="sp"></div>
  <h1>AI GB-RD（技术部）</h1>
  <p id="msg">正在校验版本…</p>
</div>
<script>
/* 版本门（Gate）
 * ------------------------------------------------------------------
 * 本文件的行为**永不改变**：它只做一件事——现取当前 build，跳到该 build 的
 * 不可变页面 e-<build>.html。因此无论哪一层缓存（浏览器 / CDN / 预览隧道）
 * 把它冻结多久，跳转目标始终是最新那次构建，不会再出现「页面停在几小时前」。
 *
 * 真实页面内容在 app.html（最新一份）与 e-<build>.html（每次构建的不可变快照）。
 * 改版只改 app.html，发布脚本负责生成新的 e-<build>.html 并递增 version.json。
 *
 * 关键细节：GitHub Pages 给**所有**资源（含 .json / .js）下发
 * cache-control: max-age=600，所以取 version.json 必须 cache:'no-store'
 * 且带唯一参数，否则会拿到 10 分钟前的旧 build 号。
 */
(function () {
  var done = false, timer = null;
  var msg = document.getElementById('msg');

  function go(file) {
    if (done) return;
    done = true;
    if (timer) { clearTimeout(timer); timer = null; }
    var h = location.hash || '';
    try { location.replace('./' + file + h); }
    catch (e) { location.href = './' + file + h; }
  }

  /* version.json 取不到时退回 app.html（最新一份，离线时由 SW 缓存兜底） */
  function fallback() { go('app.html'); }

  try {
    timer = setTimeout(fallback, 3000);
    fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('version.json ' + r.status);
        return r.json();
      })
      .then(function (v) {
        var b = (v && v.build) ? String(v.build).trim() : '';
        /* build 形如 20261123j；不合规就不猜，走兜底，避免拼出 404 的地址 */
        if (/^[0-9]{8}[a-z]{1,2}$/.test(b)) go('e-' + b + '.html');
        else fallback();
      })
      .catch(fallback);
  } catch (e) { fallback(); }
})();
</script>
<noscript><p style="text-align:center"><a href="./app.html">继续打开 AI GB-RD</a></p></noscript>

</body>
